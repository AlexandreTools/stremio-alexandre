name: Mise à jour des rangées
on:
  schedule:
    - cron: '23 3 * * *'   # every night, 03:23 UTC
  workflow_dispatch: {}      # "Run workflow" button
  push:
    paths: ['build.mjs', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rangées du $(date -u +%F)"
          git push
